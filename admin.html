<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TomHub Admin v2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#070708;
color:#fff;
min-height:100vh
}

header{
background:#0d0d0f;
border-bottom:1px solid #4b3b0c;
padding:18px
}

.container{
width:min(1100px,94%);
margin:auto
}

.logo{
font-size:25px;
font-weight:900;
color:#ffd84d
}

.logo span{color:#fff}

.login{
max-width:430px;
margin:70px auto;
background:#151518;
border:1px solid #4b3b0c;
border-radius:22px;
padding:25px;
box-shadow:0 0 30px #000
}

h1,h2{margin-top:0}

input,textarea,select{
width:100%;
padding:13px;
margin:7px 0 14px;
border-radius:11px;
border:1px solid #403713;
background:#0e0e10;
color:#fff;
font-size:15px
}

textarea{
min-height:100px;
resize:vertical
}

button{
border:0;
border-radius:11px;
padding:12px 16px;
font-weight:800;
cursor:pointer
}

.primary{
background:linear-gradient(135deg,#ffd84d,#b78300);
color:#111
}

.secondary{
background:#222225;
border:1px solid #4a421b;
color:#fff
}

.danger{
background:#591d1d;
color:#fff
}

.hidden{
display:none!important
}

.message{
background:#211d0b;
border:1px solid #665317;
color:#ffd84d;
padding:12px;
border-radius:10px;
margin-bottom:15px;
word-break:break-word
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin:20px 0
}

.stat{
background:#141416;
border:1px solid #39320f;
border-radius:17px;
padding:18px
}

.stat-number{
font-size:29px;
font-weight:900;
color:#ffd84d;
margin-top:7px
}

.tabs{
display:flex;
gap:8px;
overflow:auto;
margin-bottom:18px
}

.tabs button{
white-space:nowrap
}

.panel{
background:#141416;
border:1px solid #39320f;
border-radius:18px;
padding:20px;
margin-bottom:20px
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.full{
grid-column:1/-1
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
padding:15px 0;
border-bottom:1px solid #29291f
}

.item:last-child{
border-bottom:0
}

.item-title{
font-size:17px;
font-weight:900;
color:#ffd84d
}

.item-sub{
font-size:13px;
color:#999;
margin-top:5px;
word-break:break-all
}

.badge{
display:inline-block;
font-size:11px;
padding:5px 8px;
border-radius:8px;
background:#292713;
color:#ffd84d;
margin:5px 4px 0 0
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr 1fr
}

.form-grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.item{
align-items:flex-start;
flex-direction:column
}

}
</style>
</head>

<body>

<header>
<div class="container">
<div class="logo">
👑 Tom<span>Hub</span>
<small style="font-size:12px;color:#888">
ADMIN v2
</small>
</div>
</div>
</header>


<div id="loginScreen" class="container">

<div class="login">

<h1>🔐 TomHub Yönetim</h1>

<p style="color:#999">
Admin hesabınla giriş yap.
</p>

<div id="loginMessage"></div>

<label>E-posta</label>

<input
id="email"
type="email"
autocomplete="username"
placeholder="E-posta"
>

<label>Şifre</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Şifre"
>

<button
id="loginButton"
class="primary"
style="width:100%"
type="button"
>
Yönetim Paneline Gir
</button>

</div>
</div>


<div id="adminScreen" class="hidden">

<main class="container" style="padding:25px 0 60px">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px
">

<div>
<h1>🎮 Yönetim Merkezi</h1>
<div style="color:#999">
TomHub kontrol paneli
</div>
</div>

<button
class="secondary"
id="logoutButton"
type="button"
>
Çıkış
</button>

</div>


<div id="adminMessage"></div>


<div class="stats">

<div class="stat">
🌐 Siteler
<div
class="stat-number"
id="siteCount"
>
0
</div>
</div>

<div class="stat">
📁 Kategoriler
<div
class="stat-number"
id="categoryCount"
>
0
</div>
</div>

<div class="stat">
🖱️ Tıklamalar
<div
class="stat-number"
id="clickCount"
>
0
</div>
</div>

<div class="stat">
📝 Gönderiler
<div
class="stat-number"
id="postCount"
>
0
</div>
</div>

</div>


<div class="tabs">

<button
class="primary"
type="button"
data-panel="sitesPanel"
>
🌐 Siteler
</button>

<button
class="secondary"
type="button"
data-panel="addPanel"
>
➕ Site Ekle
</button>

<button
class="secondary"
type="button"
data-panel="categoriesPanel"
>
📁 Kategoriler
</button>

<button
class="secondary"
type="button"
data-panel="postsPanel"
>
📝 Gönderiler
</button>

</div>


<section
id="sitesPanel"
class="panel"
>

<h2>🌐 Siteler</h2>

<div id="sitesList">
Yükleniyor...
</div>

</section>


<section
id="addPanel"
class="panel hidden"
>

<h2>➕ Site Ekle</h2>

<div class="form-grid">

<div>

<label>Site adı</label>

<input
id="siteName"
placeholder="Örn: Google"
>

</div>


<div>

<label>Site adresi</label>

<input
id="siteUrl"
placeholder="https://example.com"
>

</div>


<div class="full">

<label>Açıklama</label>

<textarea
id="siteDescription"
placeholder="Site açıklaması"
></textarea>

</div>


<div>

<label>Kategori</label>

<select id="siteCategory">
<option value="">Kategori seç</option>
</select>

</div>


<div>

<label>Logo URL</label>

<input
id="siteLogo"
placeholder="https://..."
>

</div>


<div>

<label>Affiliate / Referral URL</label>

<input
id="siteAffiliate"
placeholder="https://..."
>

</div>


<div>

<label>Sıra</label>

<input
id="siteOrder"
type="number"
value="0"
>

</div>

</div>


<label>

<input
id="siteFeatured"
type="checkbox"
style="width:auto"
>

⭐ Öne çıkar

</label>


<br><br>


<button
id="addSiteButton"
class="primary"
type="button"
>
🚀 Siteyi Ekle
</button>

</section>


<section
id="categoriesPanel"
class="panel hidden"
>

<h2>📁 Kategoriler</h2>

<input
id="categoryName"
placeholder="Kategori adı"
>

<input
id="categoryIcon"
placeholder="İkon örn: 🎮"
>

<button
id="addCategoryButton"
class="primary"
type="button"
>
Kategori Ekle
</button>

<div
id="categoriesList"
style="margin-top:20px"
>
</div>

</section>


<section
id="postsPanel"
class="panel hidden"
>

<h2>📝 Gönderiler</h2>

<div id="postsList">
Yükleniyor...
</div>

</section>


</main>
</div>


<script>

/* ==============================
   TOMHUB SUPABASE
============================== */

const SUPABASE_URL =
"https://pkwyvdrqglqcqwukyssp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ayvjaaHD6lvLDiB9bAu24g_z3L3W4PW";

let sb = null;
let currentUser = null;


/* ==============================
   BAŞLAT
============================== */

function startApp(){

try{

sb = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

console.log("TomHub Supabase hazır");

}catch(error){

showLoginMessage(
"Supabase başlatılamadı: "
+ error.message
);

}

}


/* ==============================
   LOGIN
============================== */

async function doLogin(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(!email || !password){

showLoginMessage(
"E-posta ve şifreyi doldur."
);

return;

}


const button =
document
.getElementById("loginButton");

button.disabled=true;
button.textContent="Giriş yapılıyor...";


try{

const result =
await sb.auth.signInWithPassword({
email:email,
password:password
});


if(result.error){

showLoginMessage(
"Giriş başarısız: "
+
result.error.message
);

button.disabled=false;
button.textContent="Yönetim Paneline Gir";

return;

}


currentUser =
result.data.user;


if(!currentUser){

showLoginMessage(
"Kullanıcı bilgisi alınamadı."
);

button.disabled=false;
button.textContent="Yönetim Paneline Gir";

return;

}


/* ADMIN KONTROLÜ */

const adminResult =
await sb
.from("admins")
.select("user_id")
.eq(
"user_id",
currentUser.id
)
.maybeSingle();


if(adminResult.error){

showLoginMessage(
"Admin kontrolü başarısız: "
+
adminResult.error.message
);

await sb.auth.signOut();

button.disabled=false;
button.textContent="Yönetim Paneline Gir";

return;

}


if(!adminResult.data){

showLoginMessage(
"Bu hesap admin olarak tanımlanmamış."
);

await sb.auth.signOut();

button.disabled=false;
button.textContent="Yönetim Paneline Gir";

return;

}


/* PANEL */

document
.getElementById("loginScreen")
.classList
.add("hidden");

document
.getElementById("adminScreen")
.classList
.remove("hidden");


button.disabled=false;
button.textContent="Yönetim Paneline Gir";


await loadEverything();


}catch(error){

showLoginMessage(
"Beklenmeyen hata: "
+
error.message
);

button.disabled=false;
button.textContent="Yönetim Paneline Gir";

}

}


/* ==============================
   LOGOUT
============================== */

async function doLogout(){

if(sb){

await sb.auth.signOut();

}

currentUser=null;

document
.getElementById("adminScreen")
.classList
.add("hidden");

document
.getElementById("loginScreen")
.classList
.remove("hidden");

document
.getElementById("password")
.value="";

}


/* ==============================
   PANEL
============================== */

function openPanel(id){

[
"sitesPanel",
"addPanel",
"categoriesPanel",
"postsPanel"
].forEach(function(panel){

document
.getElementById(panel)
.classList
.add("hidden");

});


document
.getElementById(id)
.classList
.remove("hidden");

}


/* ==============================
   TÜM VERİLER
============================== */

async function loadEverything(){

await loadStats();

await loadCategories();

await loadSites();

await loadPosts();

}


/* ==============================
   STATS
============================== */

async function loadStats(){

const sites =
await sb
.from("promoted_sites")
.select("*",{count:"exact",head:true});


const categories =
await sb
.from("site_categories")
.select("*",{count:"exact",head:true});


const clicks =
await sb
.from("site_clicks")
.select("*",{count:"exact",head:true});


const posts =
await sb
.from("posts")
.select("*",{count:"exact",head:true});


document
.getElementById("siteCount")
.textContent =
sites.count || 0;


document
.getElementById("categoryCount")
.textContent =
categories.count || 0;


document
.getElementById("clickCount")
.textContent =
clicks.count || 0;


document
.getElementById("postCount")
.textContent =
posts.count || 0;

}


/* ==============================
   KATEGORİLER
============================== */

async function loadCategories(){

const result =
await sb
.from("site_categories")
.select("*")
.order("sort_order");


if(result.error){

showAdminMessage(
"Kategoriler yüklenemedi: "
+
result.error.message
);

return;

}


const select =
document.getElementById("siteCategory");

select.innerHTML =
'<option value="">Kategori seç</option>';


const list =
document.getElementById("categoriesList");

list.innerHTML="";


(result.data || []).forEach(function(category){

select.innerHTML +=
`
<option value="${esc(category.name)}">
${esc(category.icon || "📁")}
${esc(category.name)}
</option>
`;


list.innerHTML +=
`
<div class="item">

<div>

<div class="item-title">
${esc(category.icon || "📁")}
${esc(category.name)}
</div>

<span class="badge">
${category.is_active ? "🟢 Aktif" : "🔴 Pasif"}
</span>

</div>

</div>
`;

});

}


/* ==============================
   KATEGORİ EKLE
============================== */

async function addCategory(){

const name =
document
.getElementById("categoryName")
.value
.trim();

const icon =
document
.getElementById("categoryIcon")
.value
.trim()
||
"📁";


if(!name){

showAdminMessage(
"Kategori adı yaz."
);

return;

}


const result =
await sb
.from("site_categories")
.insert({

name:name,
icon:icon,
is_active:true

});


if(result.error){

showAdminMessage(
"Kategori eklenemedi: "
+
result.error.message
);

return;

}


document
.getElementById("categoryName")
.value="";

document
.getElementById("categoryIcon")
.value="";


showAdminMessage(
"✅ Kategori eklendi."
);


await loadCategories();

await loadStats();

}


/* ==============================
   SİTELER
============================== */

async function loadSites(){

const result =
await sb
.from("promoted_sites")
.select("*")
.order("sort_order")
.order("created_at",{ascending:false});


const list =
document.getElementById("sitesList");


if(result.error){

list.innerHTML =
`
<div class="message">
Siteler yüklenemedi:<br>
${esc(result.error.message)}
</div>
`;

return;

}


const sites =
result.data || [];


if(sites.length===0){

list.innerHTML =
'<p style="color:#999">Henüz site eklenmedi.</p>';

return;

}


list.innerHTML="";


sites.forEach(function(site){

const status =
site.is_active
?
"🟢 Aktif"
:
"🔴 Pasif";


const featured =
site.is_featured
?
'<span class="badge">⭐ Öne çıkan</span>'
:
"";


list.innerHTML +=
`
<div class="item">

<div style="min-width:0">

<div class="item-title">

${
site.logo_url
?
`
<img
src="${esc(site.logo_url)}"
style="
width:30px;
height:30px;
object-fit:contain;
vertical-align:middle;
margin-right:7px;
border-radius:7px
"
>
`
:
"🌐 "
}

${esc(site.name)}

</div>


<div class="item-sub">
${esc(site.site_url)}
</div>


<span class="badge">
📁 ${esc(site.category || "Kategori yok")}
</span>

<span class="badge">
${status}
</span>

${featured}

</div>


<div class="actions">

<button
class="secondary"
type="button"
onclick="toggleSite(${site.id},${!site.is_active})"
>
${site.is_active ? "Pasifleştir" : "Aktifleştir"}
</button>


<button
class="danger"
type="button"
onclick="removeSite(${site.id})"
>
Sil
</button>

</div>

</div>
`;

});

}


/* ==============================
   SİTE EKLE
============================== */

async function addSite(){

const name =
document
.getElementById("siteName")
.value
.trim();

const site_url =
document
.getElementById("siteUrl")
.value
.trim();

const description =
document
.getElementById("siteDescription")
.value
.trim();

const category =
document
.getElementById("siteCategory")
.value
||
null;

const logo_url =
document
.getElementById("siteLogo")
.value
.trim()
||
null;

const affiliate_url =
document
.getElementById("siteAffiliate")
.value
.trim()
||
null;

const sort_order =
Number(
document
.getElementById("siteOrder")
.value
)
||
0;

const is_featured =
document
.getElementById("siteFeatured")
.checked;


if(!name || !site_url){

showAdminMessage(
"Site adı ve site adresi gerekli."
);

return;

}


const result =
await sb
.from("promoted_sites")
.insert({

name:name,
description:description || null,
category:category,
logo_url:logo_url,
site_url:site_url,
affiliate_url:affiliate_url,
is_active:true,
is_featured:is_featured,
sort_order:sort_order

});


if(result.error){

showAdminMessage(
"Site eklenemedi: "
+
result.error.message
);

return;

}


document
.getElementById("siteName")
.value="";

document
.getElementById("siteUrl")
.value="";

document
.getElementById("siteDescription")
.value="";

document
.getElementById("siteCategory")
.value="";

document
.getElementById("siteLogo")
.value="";

document
.getElementById("siteAffiliate")
.value="";

document
.getElementById("siteOrder")
.value="0";

document
.getElementById("siteFeatured")
.checked=false;


showAdminMessage(
"🎉 Site başarıyla eklendi."
);


await loadEverything();

openPanel("sitesPanel");

}


/* ==============================
   AKTİF / PASİF
============================== */

async function toggleSite(id,status){

const result =
await sb
.from("promoted_sites")
.update({

is_active:status,
updated_at:new Date().toISOString()

})
.eq("id",id);


if(result.error){

showAdminMessage(
"Site güncellenemedi: "
+
result.error.message
);

return;

}


await loadEverything();

}


/* ==============================
   SİTE SİL
============================== */

async function removeSite(id){

if(
!confirm(
"Bu siteyi silmek istediğine emin misin?"
)
){

return;

}


const result =
await sb
.from("promoted_sites")
.delete()
.eq("id",id);


if(result.error){

showAdminMessage(
"Site silinemedi: "
+
result.error.message
);

return;

}


showAdminMessage(
"🗑️ Site silindi."
);


await loadEverything();

}


/* ==============================
   GÖNDERİLER
============================== */

async function loadPosts(){

const result =
await sb
.from("posts")
.select("*")
.order(
"created_at",
{ascending:false}
)
.limit(50);


const list =
document.getElementById("postsList");


if(result.error){

list.innerHTML =
`
<div class="message">
Gönderiler yüklenemedi:<br>
${esc(result.error.message)}
</div>
`;

return;

}


const posts =
result.data || [];


if(posts.length===0){

list.innerHTML =
'<p style="color:#999">Henüz gönderi yok.</p>';

return;

}


list.innerHTML="";


posts.forEach(function(post){

list.innerHTML +=
`
<div class="item">

<div style="min-width:0">

<div style="word-break:break-word">
${esc(post.content || "")}
</div>

<div class="item-sub">
${esc(post.created_at || "")}
</div>

</div>


<div class="actions">

<button
class="danger"
type="button"
onclick="removePost(${post.id})"
>
Sil
</button>

</div>

</div>
`;

});

}


/* ==============================
   GÖNDERİ SİL
============================== */

async function removePost(id){

if(
!confirm(
"Bu gönderiyi silmek istediğine emin misin?"
)
){

return;

}


const result =
await sb
.from("posts")
.delete()
.eq("id",id);


if(result.error){

showAdminMessage(
"Gönderi silinemedi: "
+
result.error.message
);

return;

}


showAdminMessage(
"🗑️ Gönderi silindi."
);


await loadEverything();

}


/* ==============================
   MESAJ
============================== */

function showLoginMessage(text){

document
.getElementById("loginMessage")
.innerHTML =
`
<div class="message">
${esc(text)}
</div>
`;

}


function showAdminMessage(text){

const box =
document
.getElementById("adminMessage");


box.innerHTML =
`
<div class="message">
${esc(text)}
</div>
`;


setTimeout(function(){

box.innerHTML="";

},5000);

}


/* ==============================
   GÜVENLİ HTML
============================== */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==============================
   BUTONLAR
============================== */

document
.getElementById("loginButton")
.addEventListener(
"click",
doLogin
);


document
.getElementById("logoutButton")
.addEventListener(
"click",
doLogout
);


document
.getElementById("addSiteButton")
.addEventListener(
"click",
addSite
);


document
.getElementById("addCategoryButton")
.addEventListener(
"click",
addCategory
);


document
.querySelectorAll("[data-panel]")
.forEach(function(button){

button.addEventListener(
"click",
function(){

openPanel(
button.dataset.panel
);

}
);

});


/* ENTER İLE GİRİŞ */

document
.getElementById("password")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

doLogin();

}

});


/* ==============================
   SESSION
============================== */

async function restoreSession(){

try{

const result =
await sb.auth.getSession();


if(
result.data &&
result.data.session
){

currentUser =
result.data.session.user;


const adminResult =
await sb
.from("admins")
.select("user_id")
.eq(
"user_id",
currentUser.id
)
.maybeSingle();


if(
adminResult.data
){

document
.getElementById("loginScreen")
.classList
.add("hidden");

document
.getElementById("adminScreen")
.classList
.remove("hidden");

await loadEverything();

}

}

}catch(error){

console.log(
"Session kontrolü:",
error
);

}

}


/* ==============================
   BAŞLAT
============================== */

startApp();

restoreSession();

</script>

</body>
</html>
