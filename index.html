<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TomHub — Sponsorlar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Arial,sans-serif}
:root{--gold:#d6a63a;--gold2:#f5cf69;--panel:#0d0d0d;--line:#282828;--muted:#999}
header{height:70px;background:#050505ee;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.logo{font-size:25px;font-weight:900}.logo span{color:var(--gold)}
#adminBtn{display:none;color:var(--gold2);border:1px solid #5b451c;border-radius:9px;padding:8px 12px;background:#171107;cursor:pointer}
.hero{text-align:center;padding:40px 16px 25px;background:radial-gradient(circle at top,#211707 0,#050505 45%)}
.hero .icon{font-size:42px}.hero h1{font-size:clamp(28px,7vw,46px);margin:10px 0}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);max-width:620px;margin:auto;line-height:1.5}
.wrap{max-width:1100px;margin:auto;padding:12px 15px 60px}.title{display:flex;gap:9px;align-items:center;margin:15px 0;font-weight:bold;color:var(--gold2)}.title:after{content:"";height:1px;background:var(--line);flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.card{background:linear-gradient(145deg,#151515,#090909);border:1px solid #2b2b2b;border-radius:16px;padding:16px;min-height:255px;position:relative;overflow:hidden;box-shadow:0 14px 40px #0008;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#765a20}.card:before{content:"♦";position:absolute;right:12px;top:5px;color:#d6a63a33;font-size:34px}.card:after{content:"♠";position:absolute;left:10px;bottom:2px;color:#fff1;font-size:34px}
.badge{display:inline-block;color:var(--gold2);background:#211a0c;border:1px solid #58431c;border-radius:99px;padding:5px 9px;font-size:10px}
.logoBox{height:72px;display:flex;align-items:center;justify-content:center;margin:10px 0}.logoBox img{max-width:135px;max-height:65px;object-fit:contain}.fake{font-weight:900;font-size:26px;color:var(--gold)}
.card h3{margin:0 0 7px}.card p{font-size:12px;color:var(--muted);line-height:1.45;min-height:36px}.go{display:block;background:linear-gradient(#f5cf69,#d6a63a);color:#080808;text-align:center;font-weight:900;padding:11px;border-radius:9px;font-size:12px;margin-top:13px}
.empty{text-align:center;padding:40px;color:#777;border:1px dashed #333;border-radius:15px}
#adminPanel{display:none;position:fixed;inset:0;background:#050505;z-index:50;overflow:auto;padding:20px}
.adminBox{max-width:900px;margin:auto}.adminHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.close{background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:9px 13px}
.adminCard{background:#0e0e0e;border:1px solid #292929;border-radius:14px;padding:17px;margin-bottom:15px}.adminCard h2{margin-top:0;color:var(--gold2);font-size:18px}
input,textarea{width:100%;background:#080808;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;margin:6px 0 10px;outline:none}label{font-size:12px;color:#aaa}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goldBtn{border:0;background:var(--gold);color:#080808;font-weight:900;padding:11px 15px;border-radius:8px;cursor:pointer}.danger{background:#5d2020;color:#fff}.siteRow{display:flex;gap:10px;align-items:center;border-top:1px solid #222;padding:12px 0}.siteRow img{width:45px;height:45px;object-fit:contain}.siteInfo{flex:1}.siteInfo small{color:#777}.login{max-width:390px;margin:70px auto}.msg{font-size:12px;color:#aaa;margin-top:10px}
footer{text-align:center;color:#555;border-top:1px solid var(--line);padding:25px;font-size:11px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:12px;min-height:240px}.card h3{font-size:15px}.card p{font-size:11px}.go{font-size:11px}.row{grid-template-columns:1fr}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">TOM<span>HUB</span></div>
  <button id="adminBtn" onclick="openAdmin()">👑 Yönetim</button>
</header>

<section class="hero">
  <div class="icon">💰</div>
  <h1>Güvenilir <span>Siteleri</span> Keşfet</h1>
  <p>Seçtiğimiz sponsor sitelerine TomHub üzerinden ulaş.</p>
</section>

<main class="wrap">
  <div class="title">🃏 SPONSOR SİTELER 🎲</div>
  <section id="sites" class="grid"></section>
</main>
<footer>TOMHUB © 2026 • 🃏 🎲 💰</footer>

<div id="adminPanel">
  <div class="adminBox">
    <div class="adminHead"><h1>👑 TomHub Yönetim</h1><button class="close" onclick="closeAdmin()">Kapat</button></div>

    <div id="loginBox" class="adminCard login">
      <h2>Admin Girişi</h2>
      <label>E-posta</label><input id="email" type="email" placeholder="Admin e-postası">
      <label>Şifre</label><input id="password" type="password" placeholder="Şifre">
      <button class="goldBtn" onclick="login()">Giriş Yap</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <div id="manageBox" style="display:none">
      <div class="adminCard">
        <h2>➕ Sponsor Site Ekle</h2>
        <div class="row">
          <div><label>Site adı</label><input id="name" placeholder="Örn. Sponsor Site"></div>
          <div><label>Kategori</label><input id="category" placeholder="Sponsor"></div>
        </div>
        <label>Logo URL</label><input id="logo" placeholder="https://.../logo.png">
        <label>Kısa açıklama</label><textarea id="description" rows="2" placeholder="Site açıklaması"></textarea>
        <label>Normal site adresi</label><input id="siteUrl" placeholder="https://site.com">
        <label>Affiliate / Referral bağlantın</label><input id="affiliateUrl" placeholder="https://site.com/ref/...">
        <button class="goldBtn" onclick="addSite()">Siteyi Yayına Al</button>
        <div id="addMsg" class="msg"></div>
      </div>

      <div class="adminCard">
        <h2>🌐 Sponsor Siteler</h2>
        <div id="adminSites"></div>
      </div>
      <button class="goldBtn danger" onclick="logout()">Çıkış Yap</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://pkwyvdrqglqcqwukyssp.supabase.co";
const SUPABASE_KEY="sb_publishable_ayvjaaHD6lvLDiB9Au24g_z3L3W4PW";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let isAdmin=false;

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

async function checkAdmin(){
  const {data,error}=await supabaseClient.rpc("is_admin");
  isAdmin=!error&&data===true;
  document.getElementById("adminBtn").style.display=isAdmin?"block":"none";
  return isAdmin;
}

async function loadSites(){
  const box=document.getElementById("sites");
  const {data,error}=await supabaseClient.from("promoted_sites")
    .select("id,name,description,category,logo_url,site_url,affiliate_url,is_active,sort_order")
    .eq("is_active",true).order("sort_order",{ascending:true}).order("created_at",{ascending:false});
  if(error){box.innerHTML='<div class="empty">Sponsor siteleri yüklenemedi.</div>';return}
  if(!data?.length){box.innerHTML='<div class="empty">Henüz sponsor sitesi eklenmedi.</div>';return}
  box.innerHTML=data.map(s=>`
    <article class="card">
      <span class="badge">⭐ ${esc(s.category||"SPONSOR")}</span>
      <div class="logoBox">${s.logo_url?`<img src="${esc(s.logo_url)}" alt="">`:`<div class="fake">${esc(s.name)}</div>`}</div>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.description||"Sponsor site.")}</p>
      <a class="go" href="${esc(s.affiliate_url||s.site_url)}" target="_blank" rel="noopener noreferrer sponsored">GİRİŞ YAP →</a>
    </article>`).join("");
}

async function login(){
  const msg=document.getElementById("loginMsg");
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){msg.textContent="Giriş başarısız: "+error.message;return}
  if(await checkAdmin()){document.getElementById("loginBox").style.display="none";document.getElementById("manageBox").style.display="block";await loadAdminSites()}
  else{await supabaseClient.auth.signOut();msg.textContent="Bu hesap yönetici değil."}
}

async function openAdmin(){
  document.getElementById("adminPanel").style.display="block";
  if(await checkAdmin()){document.getElementById("loginBox").style.display="none";document.getElementById("manageBox").style.display="block";await loadAdminSites()}
  else{document.getElementById("loginBox").style.display="block";document.getElementById("manageBox").style.display="none"}
}
function closeAdmin(){document.getElementById("adminPanel").style.display="none"}

async function addSite(){
  const msg=document.getElementById("addMsg");
  const payload={
    name:document.getElementById("name").value.trim(),
    category:document.getElementById("category").value.trim()||"Sponsor",
    logo_url:document.getElementById("logo").value.trim()||null,
    description:document.getElementById("description").value.trim(),
    site_url:document.getElementById("siteUrl").value.trim(),
    affiliate_url:document.getElementById("affiliateUrl").value.trim(),
    is_active:true
  };
  if(!payload.name||!payload.site_url||!payload.affiliate_url){msg.textContent="Site adı, normal adres ve affiliate bağlantısı zorunlu.";return}
  const {error}=await supabaseClient.from("promoted_sites").insert(payload);
  if(error){msg.textContent="Eklenemedi: "+error.message;return}
  msg.textContent="Site yayına alındı.";
  ["name","category","logo","description","siteUrl","affiliateUrl"].forEach(id=>document.getElementById(id).value="");
  await loadSites();await loadAdminSites();
}

async function loadAdminSites(){
  const box=document.getElementById("adminSites");
  const {data,error}=await supabaseClient.from("promoted_sites").select("id,name,logo_url,is_active").order("created_at",{ascending:false});
  if(error){box.textContent="Liste alınamadı.";return}
  box.innerHTML=(data||[]).map(s=>`
    <div class="siteRow">
      ${s.logo_url?`<img src="${esc(s.logo_url)}">`:"🎲"}
      <div class="siteInfo"><b>${esc(s.name)}</b><br><small>${s.is_active?"Yayında":"Kapalı"}</small></div>
      <button class="goldBtn" onclick="toggleSite(${s.id},${!s.is_active})">${s.is_active?"Kapat":"Yayınla"}</button>
      <button class="goldBtn danger" onclick="deleteSite(${s.id})">Sil</button>
    </div>`).join("")||"<div class='msg'>Site yok.</div>";
}

async function toggleSite(id,value){
  await supabaseClient.from("promoted_sites").update({is_active:value}).eq("id",id);
  await loadSites();await loadAdminSites();
}
async function deleteSite(id){
  if(!confirm("Bu sponsor site silinsin mi?"))return;
  await supabaseClient.from("promoted_sites").delete().eq("id",id);
  await loadSites();await loadAdminSites();
}
async function logout(){
  await supabaseClient.auth.signOut();isAdmin=false;
  document.getElementById("adminBtn").style.display="none";
  document.getElementById("manageBox").style.display="none";
  document.getElementById("loginBox").style.display="block";
  closeAdmin();
}

supabaseClient.auth.onAuthStateChange(async()=>{await checkAdmin()});
(async()=>{await checkAdmin();await loadSites()})();
</script>
</body>
</html>
