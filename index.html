<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TomHub - Siteleri Keşfet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#050914;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#07152e,#0b1f45);
  border-bottom:1px solid #17345f;
  padding:18px 20px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#38a8ff;
}

.logo span{
  color:white;
}

nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

nav button{
  background:#10284d;
  color:white;
  border:1px solid #214a80;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

nav button:hover{
  background:#1764ad;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.hero{
  background:linear-gradient(135deg,#0b1e3c,#102e5d);
  border:1px solid #1b477c;
  border-radius:20px;
  padding:35px 25px;
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  font-size:36px;
  margin-bottom:12px;
}

.hero h1 span{
  color:#36a7ff;
}

.hero p{
  color:#a9bad3;
  font-size:17px;
  margin-bottom:22px;
}

.search{
  width:100%;
  max-width:650px;
  padding:15px;
  border-radius:12px;
  border:1px solid #2a527f;
  background:#071224;
  color:white;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:#39a9ff;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:25px 0 15px;
}

.section-title h2{
  font-size:23px;
}

.site-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#0a1425;
  border:1px solid #193657;
  border-radius:16px;
  padding:20px;
  transition:.2s;
  position:relative;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#258ee0;
  box-shadow:0 8px 30px rgba(0,100,220,.15);
}

.sponsored{
  position:absolute;
  top:12px;
  right:12px;
  background:#1268b3;
  color:white;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
}

.site-logo{
  width:60px;
  height:60px;
  border-radius:14px;
  background:#122845;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin-bottom:15px;
  overflow:hidden;
}

.site-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card h3{
  font-size:20px;
  margin-bottom:8px;
}

.category{
  color:#43aaff;
  font-size:13px;
  margin-bottom:10px;
}

.card p{
  color:#9daec5;
  font-size:14px;
  line-height:1.5;
  min-height:63px;
}

.visit{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#1685dc;
  color:white;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  font-weight:bold;
}

.visit:hover{
  background:#29a0ff;
}

.add-box{
  margin-top:35px;
  background:#09172a;
  border:1px solid #1c416b;
  border-radius:18px;
  padding:25px;
}

.add-box h2{
  margin-bottom:8px;
}

.add-box p{
  color:#9fb0c7;
  margin-bottom:20px;
}

.form{
  display:grid;
  gap:12px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  background:#050d1a;
  border:1px solid #244466;
  color:white;
  padding:13px;
  border-radius:10px;
  outline:none;
}

.form textarea{
  min-height:90px;
  resize:vertical;
}

.form button{
  background:#1685dc;
  color:white;
  border:0;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.form button:hover{
  background:#29a0ff;
}

.empty{
  text-align:center;
  color:#91a4bd;
  padding:30px;
  background:#091426;
  border-radius:15px;
}

footer{
  margin-top:45px;
  padding:30px;
  text-align:center;
  color:#71859f;
  border-top:1px solid #142944;
}

@media(max-width:800px){
  .site-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:550px){
  .header{
    flex-direction:column;
  }

  .hero h1{
    font-size:28px;
  }

  .site-grid{
    grid-template-columns:1fr;
  }

  nav{
    justify-content:center;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      Tom<span>Hub</span>
    </div>

    <nav>
      <button onclick="goHome()">Ana Sayfa</button>
      <button onclick="showSponsored()">Sponsorlu Siteler</button>
      <button onclick="showAdd()">Site Ekle</button>
    </nav>

  </div>
</header>

<main class="container">

  <section class="hero">

    <h1>
      İnternetteki Siteleri <span>Keşfet</span>
    </h1>

    <p>
      İlginizi çeken web sitelerini keşfedin ve yeni platformları keşfedin.
    </p>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Site ara..."
      oninput="searchSites()"
    >

  </section>

  <div class="section-title">
    <h2>🔥 Öne Çıkan Siteler</h2>
  </div>

  <div id="siteGrid" class="site-grid"></div>

  <section id="addSection" class="add-box">

    <h2>📢 Siteni TomHub'a Ekle</h2>

    <p>
      Web siteni ziyaretçilere tanıtmak için aşağıdaki formu doldur.
    </p>

    <div class="form">

      <input id="siteName" placeholder="Site adı">

      <input id="siteUrl" placeholder="https://ornek.com">

      <input id="siteLogo" placeholder="Logo URL'si (isteğe bağlı)">

      <select id="siteCategory">
        <option value="Genel">Genel</option>
        <option value="Eğlence">Eğlence</option>
        <option value="Oyun">Oyun</option>
        <option value="Teknoloji">Teknoloji</option>
        <option value="Alışveriş">Alışveriş</option>
        <option value="Haber">Haber</option>
        <option value="Eğitim">Eğitim</option>
        <option value="Diğer">Diğer</option>
      </select>

      <textarea
        id="siteDescription"
        placeholder="Siten hakkında kısa açıklama"
      ></textarea>

      <button onclick="addSite()">
        🚀 Siteyi Ekle
      </button>

    </div>

  </section>

</main>

<footer>
  © 2026 TomHub — Siteleri keşfet
</footer>

<script>

const defaultSites = [

  {
    name:"Google",
    url:"https://www.google.com",
    logo:"",
    category:"Teknoloji",
    description:"Dünyanın en çok kullanılan arama motorlarından biri.",
    sponsored:true
  },

  {
    name:"YouTube",
    url:"https://www.youtube.com",
    logo:"",
    category:"Eğlence",
    description:"Video izleyebileceğiniz ve içerik paylaşabileceğiniz platform.",
    sponsored:true
  },

  {
    name:"GitHub",
    url:"https://github.com",
    logo:"",
    category:"Teknoloji",
    description:"Yazılım projelerini geliştirmek ve paylaşmak için platform.",
    sponsored:false
  }

];

let sites = JSON.parse(localStorage.getItem("tomhub_sites"));

if(!sites){
  sites = defaultSites;
  saveSites();
}

function saveSites(){
  localStorage.setItem("tomhub_sites", JSON.stringify(sites));
}

function renderSites(list = sites){

  const grid = document.getElementById("siteGrid");

  if(list.length === 0){

    grid.innerHTML =
      '<div class="empty">Aradığınız site bulunamadı.</div>';

    return;
  }

  grid.innerHTML = list.map((site,index)=>{

    let logo;

    if(site.logo){

      logo = `
        <img
          src="${escapeHtml(site.logo)}"
          onerror="this.style.display='none';this.parentElement.innerText='🌐'"
        >
      `;

    }else{

      logo = "🌐";

    }

    return `

      <div class="card">

        ${site.sponsored ? '<div class="sponsored">SPONSORLU</div>' : ''}

        <div class="site-logo">
          ${logo}
        </div>

        <h3>${escapeHtml(site.name)}</h3>

        <div class="category">
          ${escapeHtml(site.category)}
        </div>

        <p>
          ${escapeHtml(site.description)}
        </p>

        <a
          class="visit"
          href="${safeUrl(site.url)}"
          target="_blank"
          rel="noopener noreferrer"
          onclick="countVisit(${index})"
        >
          Siteyi Ziyaret Et →
        </a>

      </div>

    `;

  }).join("");

}

function searchSites(){

  const value =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  const filtered = sites.filter(site =>

    site.name.toLowerCase().includes(value) ||
    site.category.toLowerCase().includes(value) ||
    site.description.toLowerCase().includes(value)

  );

  renderSites(filtered);

}

function addSite(){

  const name =
    document.getElementById("siteName").value.trim();

  const url =
    document.getElementById("siteUrl").value.trim();

  const logo =
    document.getElementById("siteLogo").value.trim();

  const category =
    document.getElementById("siteCategory").value;

  const description =
    document.getElementById("siteDescription").value.trim();

  if(!name || !url || !description){

    alert("Lütfen site adı, adresi ve açıklamayı doldur.");

    return;
  }

  if(!url.startsWith("http://") && !url.startsWith("https://")){

    alert("Site adresi https:// ile başlamalı.");

    return;
  }

  sites.unshift({

    name:name,
    url:url,
    logo:logo,
    category:category,
    description:description,
    sponsored:false

  });

  saveSites();

  renderSites();

  document.getElementById("siteName").value="";
  document.getElementById("siteUrl").value="";
  document.getElementById("siteLogo").value="";
  document.getElementById("siteDescription").value="";

  alert("Site TomHub'a eklendi!");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function countVisit(index){

  const site = sites[index];

  site.visits = (site.visits || 0) + 1;

  saveSites();

}

function showAdd(){

  document.getElementById("addSection").scrollIntoView({
    behavior:"smooth"
  });

}

function showSponsored(){

  const sponsored =
    sites.filter(site => site.sponsored);

  renderSites(sponsored);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function goHome(){

  document.getElementById("search").value="";

  renderSites();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function safeUrl(url){

  if(
    url.startsWith("https://") ||
    url.startsWith("http://")
  ){
    return url;
  }

  return "#";

}

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

renderSites();

</script>

</body>
</html>
