<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlk Gönderim</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .post {
      background: white;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .date {
      color: #777;
      font-size: 12px;
      margin-top: 8px;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Gönderiler</h1>

  <textarea id="postText" placeholder="Gönderini yaz..."></textarea>

  <button id="sendButton">Gönder</button>

  <div id="message"></div>

  <div id="posts"></div>
</div>

<script>
  const SUPABASE_URL = "https://pkwyvdrqglqcqwukyssp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ayvjaaHD6lvLDiB9bAu24g_z3L3W4PW";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const postText = document.getElementById("postText");
  const sendButton = document.getElementById("sendButton");
  const posts = document.getElementById("posts");
  const message = document.getElementById("message");

  async function loadPosts() {
    const { data, error } = await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      message.textContent = "Gönderiler yüklenemedi.";
      console.error(error);
      return;
    }

    posts.innerHTML = "";

    data.forEach(post => {
      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <div>${escapeHtml(post.content || "")}</div>
        <div class="date">
          ${post.created_at ? new Date(post.created_at).toLocaleString("tr-TR") : ""}
        </div>
      `;

      posts.appendChild(div);
    });
  }

  async function sendPost() {
    const content = postText.value.trim();

    if (!content) {
      message.textContent = "Önce bir şey yaz.";
      return;
    }

    sendButton.disabled = true;
    message.textContent = "Gönderiliyor...";

    const { error } = await supabaseClient
      .from("posts")
      .insert([
        {
          content: content
        }
      ]);

    if (error) {
      message.textContent = "Gönderi gönderilemedi.";
      console.error(error);
    } else {
      postText.value = "";
      message.textContent = "Gönderildi!";
      await loadPosts();
    }

    sendButton.disabled = false;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  sendButton.addEventListener("click", sendPost);

  loadPosts();
</script>

</body>
</html>
