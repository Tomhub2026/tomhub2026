<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomhub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg:#07111f;
      --panel:#0d1b2a;
      --line:#1d3550;
      --text:#edf6ff;
      --muted:#8fa8bd;
      --blue:#1597ff;
      --danger:#d94b5b;
    }

    body {
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top,#10263d 0,#07111f 45%,#050b13 100%);
    }

    button,input,textarea {
      font:inherit;
    }

    button {
      border:0;
      border-radius:10px;
      padding:10px 15px;
      cursor:pointer;
      background:var(--blue);
      color:white;
      font-weight:700;
    }

    button:hover {
      filter:brightness(1.08);
    }

    button:disabled {
      opacity:.5;
      cursor:not-allowed;
    }

    .container {
      width:min(1180px,calc(100% - 28px));
      margin:0 auto;
      padding:24px 0 50px;
    }

    .box {
      background:rgba(13,27,42,.94);
      border:1px solid var(--line);
      padding:18px;
      border-radius:18px;
      box-shadow:0 12px 35px rgba(0,0,0,.22);
      margin-bottom:15px;
    }

    h2 {
      margin-top:0;
    }

    input,
    textarea {
      width:100%;
      background:#091725;
      color:var(--text);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      outline:none;
    }

    input:focus,
    textarea:focus {
      border-color:var(--blue);
      box-shadow:0 0 0 2px rgba(21,151,255,.12);
    }

    textarea {
      height:115px;
      resize:vertical;
    }

    .composer-title {
      display:flex;
      align-items:center;
      gap:10px;
      font-size:18px;
      font-weight:700;
      margin-bottom:12px;
    }

    .composer-bottom {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:10px;
      color:var(--muted);
      font-size:13px;
    }

    .post {
      background:#0a1725;
      border:1px solid var(--line);
      padding:16px;
      border-radius:16px;
      margin-top:14px;
    }

    .profile {
      display:flex;
      gap:11px;
      align-items:center;
      margin-bottom:13px;
    }

    .avatar {
      width:44px;
      height:44px;
      flex:none;
      border-radius:50%;
      background:linear-gradient(135deg,#1597ff,#1552d1);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
    }

    .username {
      font-weight:800;
    }

    .small,
    .date {
      color:var(--muted);
      font-size:12px;
    }

    .content {
      white-space:pre-wrap;
      line-height:1.6;
      word-wrap:break-word;
      font-size:15px;
    }

    .date {
      margin-top:10px;
    }

    .actions {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid #142a40;
    }

    .actions button {
      background:#10283e;
      color:#dcecf9;
      padding:8px 11px;
      font-size:13px;
    }

    .actions .danger {
      background:#3a1720;
      color:#ffb5bf;
    }

    .actions .secondary {
      background:#14324c;
    }

    .comments {
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid #142a40;
    }

    .comment {
      background:#102337;
      padding:9px;
      border-radius:9px;
      margin-top:7px;
      font-size:14px;
    }

    #message,
    #profileMessage {
      margin-top:9px;
      min-height:18px;
      color:#8fcaff;
      font-size:13px;
    }

    .empty {
      text-align:center;
      color:var(--muted);
      padding:30px 10px;
    }

    @media(max-width:650px) {
      .container {
        width:min(100% - 16px,600px);
        padding-top:10px;
      }

      .box {
        padding:14px;
        border-radius:15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">
    <div style="font-size:30px;font-weight:800;margin-bottom:4px;">
      🔵 TomHub
    </div>

    <div style="color:#8fa8bd;margin-bottom:20px;">
      Sosyal dünyanın yeni adresi
    </div>

    <div style="
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    ">
      <button>🏠 Ana Sayfa</button>
      <button style="background:#10283e;">🔎 Keşfet</button>
      <button style="background:#10283e;">🔔 Bildirimler</button>
      <button style="background:#10283e;">👤 Profil</button>
    </div>
  </div>


  <!-- PROFİL -->

  <div class="box">

    <h2>👤 Profilim</h2>

    <input
      id="username"
      maxlength="30"
      placeholder="Kullanıcı adın"
    >

    <br><br>

    <input
      id="bio"
      maxlength="150"
      placeholder="Hakkında"
    >

    <br><br>

    <button id="saveProfile">
      Profili Kaydet
    </button>

    <div id="profileMessage"></div>

  </div>


  <!-- GÖNDERİ OLUŞTUR -->

  <div class="box">

    <div class="composer-title">
      ✍️ Yeni gönderi oluştur
    </div>

    <textarea
      id="postText"
      maxlength="1000"
      placeholder="Aklından neler geçiyor?"
    ></textarea>

    <div class="composer-bottom">

      <span id="counter">
        0 / 1000
      </span>

      <button id="sendButton">
        🚀 Gönder
      </button>

    </div>

    <div id="message"></div>

  </div>


  <!-- GÖNDERİLER -->

  <div class="box">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
    ">
      <h2>📱 Gönderiler</h2>

      <span style="color:#8fa8bd;">
        Son gönderiler
      </span>
    </div>

    <div id="posts"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://pkwyvdrqglqcqwukyssp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ayvjaaHD6lvLDiB9bAu24g_z3L3W4PW";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* KULLANICI */

let userId =
  localStorage.getItem("tomhub_user_id");

if (!userId) {

  userId =
    "user_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,10);

  localStorage.setItem(
    "tomhub_user_id",
    userId
  );
}


/* ELEMENTLER */

const postText =
  document.getElementById("postText");

const sendButton =
  document.getElementById("sendButton");

const posts =
  document.getElementById("posts");

const message =
  document.getElementById("message");

const counter =
  document.getElementById("counter");

const username =
  document.getElementById("username");

const bio =
  document.getElementById("bio");

const saveProfile =
  document.getElementById("saveProfile");

const profileMessage =
  document.getElementById("profileMessage");


/* GÜVENLİ HTML */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* PROFİL YÜKLE */

async function loadProfile() {

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("user_id", userId)
      .maybeSingle();

  if (error) {

    console.error(error);

    return;
  }

  if (data) {

    username.value =
      data.username || "";

    bio.value =
      data.bio || "";
  }
}


/* PROFİL KAYDET */

saveProfile.addEventListener(
  "click",
  async () => {

    const name =
      username.value.trim() ||
      "Kullanıcı";

    const about =
      bio.value.trim();

    saveProfile.disabled =
      true;

    const { data: existing } =
      await supabaseClient
        .from("profiles")
        .select("id")
        .eq("user_id", userId)
        .maybeSingle();

    let error;

    if (existing) {

      ({ error } =
        await supabaseClient
          .from("profiles")
          .update({
            username:name,
            bio:about
          })
          .eq(
            "user_id",
            userId
          ));

    } else {

      ({ error } =
        await supabaseClient
          .from("profiles")
          .insert({
            user_id:userId,
            username:name,
            bio:about
          }));
    }

    if (error) {

      console.error(error);

      profileMessage.textContent =
        "Profil kaydedilemedi.";

    } else {

      profileMessage.textContent =
        "Profil kaydedildi.";

      await loadPosts();
    }

    saveProfile.disabled =
      false;
  }
);


/* KARAKTER SAYACI */

postText.addEventListener(
  "input",
  () => {

    counter.textContent =
      postText.value.length +
      " / 1000";
  }
);


/* GÖNDERİLER */

async function loadPosts() {

  message.textContent =
    "Gönderiler yükleniyor...";

  const { data, error } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if (error) {

    console.error(error);

    message.textContent =
      "Gönderiler yüklenemedi.";

    return;
  }

  posts.innerHTML = "";

  message.textContent = "";

  if (
    !data ||
    data.length === 0
  ) {

    posts.innerHTML =
      '<div class="empty">Henüz gönderi yok.</div>';

    return;
  }


  for (const post of data) {

    const div =
      document.createElement("div");

    div.className =
      "post";


    /* PROFİL */

    let profile = null;

    if (post.user_id) {

      const result =
        await supabaseClient
          .from("profiles")
          .select("*")
          .eq(
            "user_id",
            post.user_id
          )
          .maybeSingle();

      profile =
        result.data;
    }

    const displayName =
      profile?.username ||
      "Kullanıcı";


    div.innerHTML = `

      <div class="profile">

        <div class="avatar">
          ${escapeHtml(
            displayName
              .charAt(0)
              .toUpperCase()
          )}
        </div>

        <div>

          <div class="username">
            ${escapeHtml(
              displayName
            )}
          </div>

          <div class="small">
            ${escapeHtml(
              profile?.bio || ""
            )}
          </div>

        </div>

      </div>


      <div class="content">
        ${escapeHtml(
          post.content || ""
        )}
      </div>


      <div class="date">

        ${
          post.created_at
            ? new Date(
                post.created_at
              ).toLocaleString(
                "tr-TR"
              )
            : ""
        }

      </div>


      <div class="actions">

        <button class="likeButton">
          ❤️ ${post.likes || 0}
        </button>

        <button class="commentButton">
          💬 Yorum
        </button>

        ${
          post.user_id === userId

          ? `
            <button
              class="deleteButton danger"
            >
              🗑️ Sil
            </button>
          `

          : `
            <button
              class="followButton secondary"
            >
              👥 Takip Et
            </button>
          `
        }

      </div>


      <div class="comments"></div>

    `;


    posts.appendChild(div);


    /* BEĞENİ */

    const likeButton =
      div.querySelector(
        ".likeButton"
      );

    likeButton.addEventListener(
      "click",
      async () => {

        likeButton.disabled =
          true;

        const newLikes =
          (post.likes || 0) + 1;

        const { error } =
          await supabaseClient
            .from("posts")
            .update({
              likes:newLikes
            })
            .eq(
              "id",
              post.id
            );

        if (error) {

          console.error(error);

          alert(
            "Beğeni gönderilemedi."
          );

          likeButton.disabled =
            false;

          return;
        }

        await loadPosts();
      }
    );


    /* SİL */

    const deleteButton =
      div.querySelector(
        ".deleteButton"
      );

    if (deleteButton) {

      deleteButton.addEventListener(
        "click",
        async () => {

          const ok =
            confirm(
              "Bu gönderiyi silmek istiyor musun?"
            );

          if (!ok)
            return;

          deleteButton.disabled =
            true;

          const { error } =
            await supabaseClient
              .from("posts")
              .delete()
              .eq(
                "id",
                post.id
              )
              .eq(
                "user_id",
                userId
              );

          if (error) {

            console.error(error);

            alert(
              "Gönderi silinemedi."
            );

            deleteButton.disabled =
              false;

            return;
          }

          await loadPosts();
        }
      );
    }


    /* TAKİP */

    const followButton =
      div.querySelector(
        ".followButton"
      );

    if (
      followButton &&
      post.user_id
    ) {

      followButton.addEventListener(
        "click",
        async () => {

          if (
            post.user_id ===
            userId
          ) {
            return;
          }

          followButton.disabled =
            true;

          const {
            data:existingFollow
          } =
            await supabaseClient
              .from("follows")
              .select("id")
              .eq(
                "follower_id",
                userId
              )
              .eq(
                "following_id",
                post.user_id
              )
              .maybeSingle();

          if (existingFollow) {

            const { error } =
              await supabaseClient
                .from("follows")
                .delete()
                .eq(
                  "id",
                  existingFollow.id
                );

            if (error) {

              console.error(error);

            } else {

              followButton.textContent =
                "👥 Takip Et";
            }

          } else {

            const { error } =
              await supabaseClient
                .from("follows")
                .insert({
                  follower_id:userId,
                  following_id:
                    post.user_id
                });

            if (error) {

              console.error(error);

            } else {

              followButton.textContent =
                "✓ Takiptesin";
            }
          }

          followButton.disabled =
            false;
        }
      );
    }


    /* YORUM */

    const commentButton =
      div.querySelector(
        ".commentButton"
      );

    const comments =
      div.querySelector(
        ".comments"
      );


    commentButton.addEventListener(
      "click",
      async () => {

        if (
          comments.innerHTML !== ""
        ) {

          comments.innerHTML =
            "";

          return;
        }


        comments.innerHTML = `

          <input
            class="commentInput"
            maxlength="500"
            placeholder="Yorumunu yaz..."
          >

          <button class="sendComment">
            Yorum Yap
          </button>

          <div class="commentList">
            Yükleniyor...
          </div>

        `;


        const input =
          comments.querySelector(
            ".commentInput"
          );

        const sendComment =
          comments.querySelector(
            ".sendComment"
          );

        const commentList =
          comments.querySelector(
            ".commentList"
          );


        async function loadComments() {

          const {
            data,
            error
          } =
            await supabaseClient
              .from("comments")
              .select("*")
              .eq(
                "post_id",
                post.id
              )
              .order(
                "created_at",
                {
                  ascending:true
                }
              );

          if (error) {

            console.error(error);

            commentList.textContent =
              "Yorumlar yüklenemedi.";

            return;
          }

          if (
            !data ||
            data.length === 0
          ) {

            commentList.innerHTML =
              '<div class="small">Henüz yorum yok.</div>';

            return;
          }


          commentList.innerHTML =
            "";


          data.forEach(
            comment => {

              const item =
                document.createElement(
                  "div"
                );

              item.className =
                "comment";

              item.innerHTML = `

                ${escapeHtml(
                  comment.content
                )}

                ${
                  comment.user_id ===
                  userId

                  ? `
                    <button
                      class="danger deleteComment"
                    >
                      Sil
                    </button>
                  `

                  : ""
                }

              `;


              const deleteComment =
                item.querySelector(
                  ".deleteComment"
                );


              if (
                deleteComment
              ) {

                deleteComment.addEventListener(
                  "click",
                  async () => {

                    const {
                      error
                    } =
                      await supabaseClient
                        .from(
                          "comments"
                        )
                        .delete()
                        .eq(
                          "id",
                          comment.id
                        )
                        .eq(
                          "user_id",
                          userId
                        );

                    if (error) {

                      console.error(
                        error
                      );

                      alert(
                        "Yorum silinemedi."
                      );

                      return;
                    }

                    await loadComments();
                  }
                );
              }


              commentList.appendChild(
                item
              );

            }
          );
        }


        sendComment.addEventListener(
          "click",
          async () => {

            const text =
              input.value.trim();

            if (!text)
              return;

            sendComment.disabled =
              true;

            const { error } =
              await supabaseClient
                .from("comments")
                .insert({
                  post_id:post.id,
                  user_id:userId,
                  content:text
                });

            if (error) {

              console.error(error);

              alert(
                "Yorum gönderilemedi."
              );

              sendComment.disabled =
                false;

              return;
            }

            input.value =
              "";

            sendComment.disabled =
              false;

            await loadComments();
          }
        );


        await loadComments();

      }
    );

  }
}


/* GÖNDERİ EKLE */

async function sendPost() {

  const content =
    postText.value.trim();

  if (!content) {

    message.textContent =
      "Önce bir şey yaz.";

    return;
  }

  sendButton.disabled =
    true;

  message.textContent =
    "Gönderiliyor...";


  const { error } =
    await supabaseClient
      .from("posts")
      .insert({
        content:content,
        likes:0,
        user_id:userId
      });


  if (error) {

    console.error(error);

    message.textContent =
      "Gönderi gönderilemedi.";

  } else {

    postText.value =
      "";

    counter.textContent =
      "0 / 1000";

    message.textContent =
      "Gönderildi!";

    await loadPosts();
  }


  sendButton.disabled =
    false;
}


sendButton.addEventListener(
  "click",
  sendPost
);


/* BAŞLANGIÇ */

loadProfile();
loadPosts();

</script>

</body>
</html>
