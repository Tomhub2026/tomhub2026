```html
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gönderiler</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      height: 100px;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #sendButton {
      background: #222;
      color: white;
    }

    .post {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .date {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }

    .likeButton {
      margin-top: 10px;
      background: white;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Gönderiler</h1>

  <textarea id="postText" placeholder="Gönderini yaz..."></textarea>

  <button id="sendButton">Gönder</button>

  <div id="message"></div>

  <div id="posts"></div>

</div>

<script>

  const SUPABASE_URL = "https://pkwyvdrqglqcqwukyssp.supabase.co";

  const SUPABASE_KEY = "sb_publishable_ayvjaaHD6lvLDiB9bAu24g_z3L3W4PW";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  const postText = document.getElementById("postText");
  const sendButton = document.getElementById("sendButton");
  const posts = document.getElementById("posts");
  const message = document.getElementById("message");


  async function loadPosts() {

    const { data, error } = await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false });


    if (error) {

      message.textContent = "Gönderiler yüklenemedi.";

      console.error(error);

      return;
    }


    posts.innerHTML = "";


    data.forEach(post => {

      const div = document.createElement("div");

      div.className = "post";


      div.innerHTML = `
        <div>${escapeHtml(post.content || "")}</div>

        <div class="date">
          ${post.created_at
            ? new Date(post.created_at).toLocaleString("tr-TR")
            : ""}
        </div>

        <button class="likeButton">
          ❤️ <span>${post.likes || 0}</span>
        </button>
      `;


      posts.appendChild(div);


      const likeButton = div.querySelector(".likeButton");


      likeButton.addEventListener("click", async () => {

        likeButton.disabled = true;


        const newLikes = (post.likes || 0) + 1;


        const { error } = await supabaseClient
          .from("posts")
          .update({
            likes: newLikes
          })
          .eq("id", post.id);


        if (error) {

          console.error(error);

          likeButton.disabled = false;

          return;
        }


        await loadPosts();

      });

    });

  }


  async function sendPost() {

    const content = postText.value.trim();


    if (!content) {

      message.textContent = "Önce bir şey yaz.";

      return;
    }


    sendButton.disabled = true;

    message.textContent = "Gönderiliyor...";


    const { error } = await supabaseClient
      .from("posts")
      .insert([
        {
          content: content,
          likes: 0
        }
      ]);


    if (error) {

      message.textContent = "Gönderi gönderilemedi.";

      console.error(error);

    } else {

      postText.value = "";

      message.textContent = "Gönderildi!";

      await loadPosts();

    }


    sendButton.disabled = false;

  }


  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  sendButton.addEventListener("click", sendPost);


  loadPosts();

</script>

</body>
</html>
